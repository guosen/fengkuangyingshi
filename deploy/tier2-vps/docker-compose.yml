# Tier2：与 Tier1 相同的 LibreTV 镜像与环境变量键名，仅换部署目标。
# 订阅 URL 仍可使用 GitHub Pages 上的 sources.json，或改为 VPS 静态目录。

services:
  libretv:
    image: ${LIBRETV_IMAGE:-ghcr.io/librespark/libretv:latest}
    container_name: fengkuangyingshi-libretv
    restart: unless-stopped
    ports:
      - "${LIBRETV_HOST_PORT:-8080}:8080"
    env_file:
      - .env
    # 无状态：历史在浏览器；源列表由 DEFAULT_SUBSCRIPTIONS 或本仓库 Pages 提供

